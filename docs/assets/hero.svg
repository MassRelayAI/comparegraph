<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 400" width="1050" role="img" aria-labelledby="t d">
<title id="t">Who has what: four repositories against four features, each answer pointing at the code</title><desc id="d">On the left, four cloned repositories: code-review-graph, srclight, codanna and CodeGraph. An arrow labelled comparegraph build, map and claim leads to a table of four features against the four repositories. Full-text search: all four have it. Embedding search: all four have it. Module communities: code-review-graph and srclight have it, codanna does not, CodeGraph partly. Diff-aware review: code-review-graph, srclight and CodeGraph have it, codanna does not. Two cells are opened: code-review-graph's communities cell cites code_review_graph/communities.py::detect_communities, and codanna's none cell records the search that found nothing, louvain, leiden, community, connected_component and modularity over src. The verdicts are the cells both readers agreed on in the mapping gold, fixtures/gold-map.</desc>
